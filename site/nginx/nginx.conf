# Runs as the unprivileged nginx user on :8080. All writable paths live in /tmp
# so the root filesystem can be mounted read-only (enforced in the Helm chart).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  access_log /dev/stdout combined;
  server_tokens off;          # don't advertise the nginx version
  sendfile on;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml application/json;
  client_max_body_size 1k;    # static site: no request bodies expected

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;    # Cloud Run/Firebase terminate TLS; keep redirects relative

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Hashed Astro assets never change, so cache them for a year.
    location /_astro/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    location ~ /\. { deny all; }   # never serve dotfiles

    location / {
      include /etc/nginx/security-headers.conf;
      # Short CDN cache so deploys show up quickly.
      add_header Cache-Control "public, max-age=300, s-maxage=600";
      try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
  }
}
