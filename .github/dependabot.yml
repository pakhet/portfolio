version: 2
updates:
  - package-ecosystem: npm
    directory: /site
    schedule: { interval: weekly }
    groups: { astro: { patterns: ["astro", "@astrojs/*"] } }
  - package-ecosystem: docker
    directory: /site
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly }
