name: pipeline

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # weekly rebuild picks up base-image security patches (e.g. nginx)
  workflow_dispatch:

# Default to no permissions; each job asks only for what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: portfolio

jobs:
  site:
    name: Build site
    runs-on: ubuntu-latest
    permissions: { contents: read }
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 26, cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: security.txt must not be within 30 days of expiry
        run: |
          exp=$(grep '^Expires:' public/.well-known/security.txt | cut -d' ' -f2)
          if [ "$(date -d "$exp" +%s)" -lt "$(date -d '+30 days' +%s)" ]; then
            echo "::error file=site/public/.well-known/security.txt::Expires ($exp) is less than 30 days away. Bump it."
            exit 1
          fi
          test -f dist/.well-known/security.txt

  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  iac:
    name: IaC lint & scan
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive infra/terraform
      - run: terraform -chdir=infra/terraform init -backend=false && terraform -chdir=infra/terraform validate
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - run: helm lint deploy/helm/portfolio
      - name: Trivy misconfiguration scan (Terraform, Helm, Dockerfile)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  image:
    name: Container build, scan & k8s test
    runs-on: ubuntu-latest
    needs: [site]
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Build image
        run: docker build -t $IMAGE_NAME:ci site
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Prove the same image runs on Kubernetes with a hardened pod spec,
      # without paying for a cluster: spin up kind, deploy the Helm chart, test it.
      - uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with: { cluster_name: ci }
      - name: Deploy chart to kind
        run: |
          kind load docker-image $IMAGE_NAME:ci --name ci
          helm install portfolio deploy/helm/portfolio \
            --set image.repository=$IMAGE_NAME --set image.tag=ci --wait --timeout 120s
      - name: Smoke test
        run: |
          kubectl port-forward svc/portfolio 8080:80 &
          sleep 3
          curl -fsS http://127.0.0.1:8080/healthz
          headers=$(curl -fsSI http://127.0.0.1:8080/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^strict-transport-security:'
          ! echo "$headers" | grep -qi '^server: nginx/'   # version must be hidden
          curl -fsS http://127.0.0.1:8080/projects/incident-radar > /dev/null
          curl -fsS http://127.0.0.1:8080/.well-known/security.txt | grep -q '^Contact:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.git/config)" = 403

  deploy:
    name: Deploy to GCP
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [site, secrets-scan, iac, image]
    runs-on: ubuntu-latest
    environment: production # WIF only trusts this environment
    permissions:
      contents: read
      id-token: write # OIDC token for keyless GCP auth + keyless image signing
    env:
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/portfolio/portfolio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: gcloud auth configure-docker $REGISTRY --quiet
      - name: Build & push
        id: push
        run: |
          tag="${GITHUB_SHA}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"  # unique: registry tags are immutable
          docker build --pull -t "$IMAGE:$tag" site
          docker push "$IMAGE:$tag"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$tag")" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image & attach SBOM (keyless)
        run: |
          cosign sign --yes ${{ steps.push.outputs.digest }}
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json ${{ steps.push.outputs.digest }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@2028e2d7d30a78c6910e0632e48dd561b064884d # v3
        with:
          service: portfolio
          region: ${{ vars.GCP_REGION }}
          image: ${{ steps.push.outputs.digest }}
      - name: Deploy Firebase Hosting config
        run: npx --yes firebase-tools@latest deploy --only hosting --project ${{ vars.GCP_PROJECT_ID }} --non-interactive
