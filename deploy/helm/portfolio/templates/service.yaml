apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "portfolio.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "portfolio.selector" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
---
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "portfolio.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "portfolio.selector" . | nindent 6 }}
{{- end }}
---
{{- if .Values.networkPolicy.enabled }}
# Default-deny for this app: only the ingress controller namespace may connect,
# and the pods may not open any outbound connections at all.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "portfolio.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "portfolio.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.allowFromNamespaceLabels | nindent 14 }}
      ports:
        - { port: 8080, protocol: TCP }
  egress: []
{{- end }}
